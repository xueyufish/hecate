[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hecate"
version = "0.1.0"
description = "Enterprise-grade, open-source, self-hosted, model-agnostic, MCP-first Agent platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Hecate Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "jsonschema>=4.23.0",
    "tiktoken>=0.7.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "jinja2>=3.1.0",
    "email-validator>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.9",
    "fastmcp>=4.0.0b3,<5",
    "mcp>=2.0.0",
    "mcp-types>=2.0.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "litellm>=1.50.0",
    "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/xueyufish/hecate"
Repository = "https://github.com/xueyufish/hecate"
Documentation = "https://github.com/xueyufish/hecate/tree/main/docs"
Issues = "https://github.com/xueyufish/hecate/issues"

[project.scripts]
hecate = "hecate.cli.main:app"
hecate-migrate = "hecate.cli.migrate:main"
hecate-flag-audit = "hecate.cli.flag_audit:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hecate = { workspace = true }

[project.optional-dependencies]
llm = [
    "litellm>=1.50.0",
]
temporal = [
    "temporalio>=1.7.0",
]
rag = [
    "qdrant-client>=1.12.0",
    "chromadb>=0.5.0",
    "docling>=2.0",
    "FlagEmbedding>=1.2",
    "minio>=7.2",
    "ragas>=0.2.0",
]
security = [
    # Core security primitives (rate limiting, core authlib usage, DLP
    # outbound engines). SSO / SCIM / cloud-vault heavy deps moved to
    # hecate-enterprise extras (see packages/hecate-enterprise/pyproject.toml).
    "llm-guard>=0.3.0",
    "slowapi>=0.1.9",
    "authlib>=1.3.0",
    # Outbound DLP engine (4.x) — Presidio NER and detect-secrets for
    # the SecretsRecognizer and PresidioRecognizer. The built-in regex
    # and dictionary recognizers work without these.
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "detect-secrets>=1.5",
    "spacy>=3.7,<3.8",
]
tools = [
    "duckduckgo-search>=6.0",
    "tavily-python>=0.5",
    "a2a-sdk>=1.1.0",
    "aiodocker>=0.23.0",
    "lark-oapi[aiohttp]>=1.4.0",
    "slack-bolt>=1.18.0",
    "playwright>=1.40,<2.0",
]
redis = [
    "redis>=5.0.0",
    "fakeredis>=2.23.0",
    "psycopg[binary]>=3.1.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "wrapt>=1.13.0",
    "opentelemetry-semantic-conventions>=0.65b0",
    "aiosmtplib>=3.0.0",
]
mysql = [
    "aiomysql>=0.2",
]
scheduling = [
    "apscheduler~=3.10",
    "croniter~=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.0",
    "aiosqlite>=0.20",
    "deepdiff>=8.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "wrapt>=1.13.0",
    "opentelemetry-semantic-conventions>=0.65b0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hecate"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "SIM"]

[tool.ruff.lint.isort]
# The repo-root alembic/ directory makes ruff >=0.12 src-detection classify
# the alembic package as first-party, diverging from older ruff (pre-commit
# pins 0.11.x, CI installs latest). Pin the classification explicitly.
known-third-party = ["alembic", "pytest", "sqlalchemy"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S607", "S105"]
"tests/test_services/test_browser/test_integration.py" = ["S310"]
"alembic/versions/**" = ["S608"]
"src/hecate/models/alert.py" = ["S105"]
"src/hecate/cli/migrate.py" = ["S603", "S607"]
"src/hecate/main.py" = ["S110"]
"src/hecate/services/preflight.py" = ["S603", "S607"]
"src/hecate/cli/flag_audit.py" = ["SIM102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "perf: performance benchmarks, excluded from default suite via -m not perf",
    "integration: requires Docker, opt-in via RUN_INTEGRATION_TESTS=1",
]
addopts = ["-m", "not perf"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["src/hecate/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src:packages/hecate-enterprise/src:packages/hecate-memory/src"
strict = true
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["type-arg", "import-not-found", "import-untyped", "no-untyped-def", "no-untyped-call", "no-any-return", "attr-defined", "assignment", "union-attr", "arg-type", "misc"]
