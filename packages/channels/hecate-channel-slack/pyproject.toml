[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hecate-channel-slack"
version = "0.1.0"
description = "Slack IM channel adapter for Hecate — implements the ChannelProvider contract"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Hecate Team" },
]
dependencies = [
    "hecate>=0.1.0",
    "slack-bolt>=1.18.0",
]

[project.entry-points."hecate.channel_providers"]
slack = "hecate_channel_slack.provider:provider"

[tool.hatch.build.targets.wheel]
packages = ["src/hecate_channel_slack"]
