[project]
name = "hecate-governance"
version = "0.1.0"
description = "Execution governance primitives: verified principal envelope, controlled action records, invocation identity, approval binding and usage accounting contracts (step7 local slice)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecate_governance"]
