[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hecate-runner"
version = "0.1.0"
description = "Standalone execution host for the Hecate runtime kernel (technical preview)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Hecate Team" },
]
dependencies = [
    "hecate-runtime",
    "hecate-durable",
    "hecate-governance",
    "jsonschema>=4.23,<5",
    "cryptography>=42.0.0",
]

[project.scripts]
hecate-runner = "hecate_runner.__main__:main"
hecate-runner-sign = "hecate_runner.sign:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hecate_runner"]

[tool.uv.sources]
hecate-runtime = { workspace = true }
hecate-durable = { workspace = true }
hecate-governance = { workspace = true }
