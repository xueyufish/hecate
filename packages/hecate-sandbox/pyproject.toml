[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hecate-sandbox"
version = "0.1.0"
description = "Hecate sandbox / browser / environment domain — extracted from core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Hecate Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "hecate>=0.1.0",
    "aiodocker>=0.25.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hecate_sandbox"]
