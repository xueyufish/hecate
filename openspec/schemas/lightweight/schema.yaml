name: lightweight
version: 1
description: Manually selected concise changes without product delta specs
artifacts:
  - id: proposal
    generates: proposal.md
    description: Concise intent, scope, and acceptance criteria
    template: proposal.md
    instruction: |
      Use this schema only when the user selects it in a manually invoked
      OpenSpec action. State intent, existing behavior, scope, and acceptance
      criteria concisely. Reference established decisions rather than repeat
      background. This schema has no product delta specs; if the requested
      contract needs them, resolve schema selection instead of silently
      omitting requirements. Ordinary work does not need a change record.
    requires: []
  - id: tasks
    generates: tasks.md
    description: Small implementation and targeted-verification checklist
    template: tasks.md
    instruction: |
      List only the implementation and affected verification tasks. Each task
      must have a checkable outcome. Preserve the common repository checks and
      record the exact commands and results in the PR or verification notes.
    requires:
      - proposal
apply:
  requires:
    - tasks
  tracks: tasks.md
