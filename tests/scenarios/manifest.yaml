# Platform evolution scenario pack — machine-readable manifest.
#
# Single source of truth for scenario ↔ P-group ↔ assertion ↔ unsupported
# capability mapping. `docs/research/platform-evolution-baseline.md` (change
# `platform-evolution-baseline`) must REFERENCE this file, never copy it.
# A consistency test (test_manifest_consistency.py) enforces bidirectional
# binding between entries here and test functions in this directory.
#
# Scenario status semantics:
#   implemented — a test function with the `test_s<nn>_` prefix exists here
#   planned     — defined but gated on a named change; no test may exist yet

# SC group (standalone-consumption) semantics:
#   Entries live under `sc_scenarios` (independent top-level key) because their
#   contract differs from S entries: run_mode + responsible_step + gating on
#   later-step changes. `implemented` requires a `test_sc<nn>_*` test function
#   here; `planned` entries must NOT have one. `blocked_by` names are the
#   plan's suggested change names (plan §7) — rename there first if steps
#   change, then flip entries. Titles are verbatim from plan §8 matrix rows.
#
# P-group coverage status semantics:
#   covered   — scenarios in this pack fully verify the group's step1 slice
#   partial   — some aspects verified here, rest belongs to later steps
#   planned   — gated scenario(ies) exist but not yet implemented
#   deferred  — intentionally out of scope for step1; reason required
schema_version: 1
_meta:
  purpose: >-
    Architecture evaluation pack for the platform evolution plan
    (docs/refactor/enterprise-agent-platform-evolution-plan.md, step1).
  baseline_doc: docs/refactor/platform-evolution-baseline.md
  baseline_doc_sync: synced # step1-baseline-completion flipped this after the baseline doc gained the reference; test_baseline_doc_sync_obligation pins it
  standalone_baseline_doc: docs/refactor/standalone-consumption-baseline.md
  standalone_baseline_doc_sync: synced # standalone-consumption-baseline flipped this after the standalone doc gained the reference; test_standalone_baseline_doc_registration_alignment pins it
tiers:
  tier1: >-
    CI-deterministic: stub model, in-memory SQLite, stub enterprise tools;
    runs with pytest, no network, no real model, no external systems.
  tier2: >-
    Recorded baselines: real-model or rubric-scored runs recorded as JSON;
    never collected or executed by CI; business value marked unverified.
p_groups:
  P01:
    title: 检索失败诊断
    status: partial
    reason: >-
      Synthetic corpus carries versions, ACLs, and canonical citation anchors
      (S09); retrieval-strategy comparison and stage diagnostics belong to
      step9d/step10.
  P02:
    title: 企业知识接入
    status: deferred
    reason: Knowledge ingestion lifecycle (sources, sync watermarks, delete propagation) is step9c/step16 scope; only corpus version fixtures exist here.
  P03:
    title: RAG 评测
    status: partial
    reason: Tier-2 baseline dataset reuses the evaluation module's EvalInput/Score format (baselines/); publish-gate integration is step10/step11.
  P04:
    title: GraphRAG/KG
    status: deferred
    reason: No business scenario requires graph retrieval yet; stays optional/research per plan.
  P05:
    title: 工具调用可靠性
    status: partial
    reason: >-
      S01/S02/S05/S07/S08 verify the allow/deny loop, duplicate-submit
      idempotency, and four-state recovery at the ToolWorker boundary;
      parameter-schema validation negative cases are not asserted yet.
  P06:
    title: 身份/权限/安全
    status: partial
    reason: >-
      S02/S03/S09 verify REST-path authorization, approval fail-close, and
      corpus ACL; S06 adds MCP/REST parity, cross-tenant, and unapproved-write
      negatives; S11 adds reviewer-identity separation on the full chain.
      Delegation chains belong to step7/step13.
  P07:
    title: 流程与人工介入
    status: partial
    reason: >-
      S03 verifies approval gating on the direct loop and S11 composes the
      full acceptance chain (read -> draft -> independent review -> human
      approval -> ticket write); durable cross-backend coordination belongs to
      step6/step13.
  P08:
    title: 评测、观测与生产定位
    status: partial
    reason: S04 verifies explicit failure on backend loss and S10 pins old-path protocol structure as migration baseline; event pipeline comparison is step10.
scenarios:
  - id: S01
    title: 正常执行
    status: implemented
    tier: 1
    entries: [rest_chat_agent]
    p_groups: [P05]
    assertions: >-
      Agent tool loop over POST /v1/agents/{id}/chat/completions: stub model
      proposes a ticket write, stub ticket service executes exactly once, final
      answer references the business result (ticket id), no verbatim text match.
  - id: S02
    title: 拒绝动作
    status: implemented
    tier: 1
    entries: [rest_chat_agent]
    p_groups: [P06]
    assertions: >-
      A deny rule on the ticket tool rejects the call before execution; the
      tool result reports the denial, the stub records zero invocations, and
      the conversation completes without the protected write.
  - id: S03
    title: 等待审批
    status: implemented
    tier: 1
    entries: [rest_chat_agent]
    p_groups: [P06, P07]
    assertions: >-
      An ask rule routes the call to the approval callback. Fail-closed path
      (no answerer): APPROVAL_ASKED/APPROVAL_DECIDED pair persisted, action
      not executed. Approved path (scripted answerer on the documented
      _inner_backend plug point): action executes exactly once, approved
      decision event persisted.
  - id: S04
    title: 后端失联
    status: implemented
    tier: 1
    entries: [rest_chat]
    p_groups: [P08]
    assertions: >-
      Model backend unreachable (scripted connection failure) surfaces as an
      explicit 500 INTERNAL_ERROR envelope; no fabricated success, no partial
      result presented as complete.
  - id: S05
    title: 重复提交
    status: implemented
    tier: 1
    entries: [tool_worker]
    p_groups: [P05]
    assertions: >-
      Re-dispatching the identical (session, tool_call_id) action at the engine
      ToolWorker boundary produces the protected side effect exactly once; the
      duplicate gets the original business result back, not a new ticket.
  - id: S06
    title: MCP 权限负例
    status: implemented
    tier: 1
    entries: [mcp, rest_agents]
    p_groups: [P06]
    assertions: >-
      Viewer agent creation is rejected at the MCP entry and at the REST entry
      with no DB row leaked (entry-independent role enforcement from
      server-side trusted context); a workspace token cannot execute another
      workspace's tool; an approval_required tool is rejected before execution.
  - id: S07
    title: 结果缺失恢复
    status: implemented
    tier: 1
    entries: [tool_worker]
    p_groups: [P05]
    assertions: >-
      After a claimed dispatch (crash after TOOL_CALL, receipt missing) and
      after an indeterminate backend failure (outcome_unknown), recovery at
      the ToolWorker boundary withholds the protected write for review — the
      side effect happened exactly once and is never blind-retried.
  - id: S08
    title: 恢复真实结果与参数冲突
    status: implemented
    tier: 1
    entries: [tool_worker]
    p_groups: [P05]
    assertions: >-
      Recovery of a succeeded call restores the real recorded business result
      (ticket id) from the channel history, never a placeholder; the same
      action key replayed with changed arguments is rejected as a conflict and
      not executed.
  - id: S09
    title: 语料 ACL 与引用定位
    status: implemented
    tier: 1
    entries: [corpus_index]
    p_groups: [P06, P01]
    assertions: >-
      Corpus documents carry version/ACL/citation anchors; unauthorized
      principals cannot retrieve protected documents; authorized retrieval
      resolves citations to declared anchors.
  - id: S10
    title: 旧路径协议黄金样本
    status: implemented
    tier: 1
    entries: [rest_chat]
    p_groups: [P08]
    assertions: >-
      Golden files pin the old chat path's response protocol structure and
      stream chunk sequence (recorded with a stub model). Assertions compare
      structure only — model text never compared verbatim. Migration baseline
      for step5 entry convergence.
  - id: S11
    title: 独立复核全链
    status: implemented
    tier: 1
    entries: [rest_chat_agent]
    p_groups: [P06, P07]
    assertions: >-
      Full acceptance chain: a corpus-read stub tool returns material once to
      the draft agent; a second, distinct reviewer agent (own agent row and
      session) receives the draft text plus review instructions only; review
      rejection proposes no ticket and leaves zero side effects and zero
      approval events; review pass routes the write through the ask rule, and
      after the human approval the ticket service executes exactly once with
      the final answer referencing the real ticket id. Content-quality review
      stays in the Tier-2/step10 rubric scope.
sc_scenarios:
  # Standalone-consumption acceptance scenarios (plan §8 SC rows). All entries
  # start `planned`: the standalone runner/wheel does not exist yet. Each flips
  # to `implemented` only when its gating change delivers a `test_sc<nn>_*`
  # test; registration alone never counts as delivery.
  - id: SC01
    title: 干净安装与无控制面冷启动
    run_mode: standalone
    status: implemented
    tier: 1
    responsible_step: 5b/5c（认证 step16；5c 已交付，见 test_sc01_cold_start.py）
    assertions: >-
      No full-Hecate install, no repo mount, no platform management tables;
      only the profile's required adapters are configured and the host starts;
      the management service is never connected and unreachable, and a
      read-only execution still completes with local evidence.
  - id: SC02
    title: 结构化库存读取与越权调用
    run_mode: standalone
    status: implemented
    tier: 1
    responsible_step: 5c（预览已交付，见 test_sc02_inventory_read.py；生产权限仍归 step7）
    assertions: >-
      Authorized data domain is read through the structured business-API
      fixture; cross-domain and forged-role requests are rejected; generated
      advice triggers no write; execution works with no Memory/RAG/vector
      store installed and leaves local evidence.
  - id: SC03
    title: 本地批准写入与重启
    run_mode: standalone
    status: planned
    tier: 1
    responsible_step: 6/7
    blocked_by: standalone-durable-actions
    implemented_slices: [wheel_process_restart, terminal_write_persistence, approval_wait_process_restart, ledger_backfill_no_redo]
    gaps: >-
      Owner/token wake is a technical waiting primitive. Independent approval
      authority, separation of duties and parameter-bound business permission
      remain step7 work; interrupted external writes and PostgreSQL process
      acceptance remain step6 closure gates.
    assertions: >-
      The protected write executes only with valid parameter binding, current
      permission, and approval; after restart the wait/result is recoverable
      or reconciled, unknown results are never rewritten, and no platform
      approval service is involved. Process-level: wheel clean install, hard
      kill + restart over the same database, business-side call counting.
  - id: SC04
    title: 受管断连与授权过期
    run_mode: managed
    status: planned
    tier: 1
    responsible_step: 7
    blocked_by: managed-runner-enrollment
    implemented_slices: [lease_renewal_policy, disconnect_staleness_window, replay_window_persistence]
    gaps: >-
      The step6b technical loop is delivered (tests/scenarios/
      test_sc04_lease_renewal_policy.py: multi-action renewal per declared
      window, bounded refusal on stopped lease delivery, immediate
      out-of-scope refusal, restart-persistent nonce replay record) and
      runs on both SQLite and PostgreSQL in CI (step6-pg-process-matrix).
      Expiry-policy certification against real clock skew, tool-level
      action scope, legal approval judgment and revocation windows remain
      with step7.
    assertions: >-
      Execution continues only within the granted scope and validity window;
      expired grants and untrustworthy time are rejected per policy;
      online-judgment operations stop; the host never falls back to local
      self-authorization.
  - id: SC05
    title: 重连与重复控制命令
    run_mode: managed
    status: planned
    tier: 1
    responsible_step: 4/6/7
    blocked_by: runner managed dispatch loop, action-time lease enforcement and process restart acceptance
    implemented_slices: [delivery_acceptance, event_projection, lease_gate, managed_loop, action_authorization, managed_wake_chain, managed_command_receipt]
    gaps: >-
      The managed wake-chain and reconnect suites run on both SQLite and
      PostgreSQL in CI (step6-pg-process-matrix job, per-test schema
      isolation on the shared database). Connection-loss stale window and
      legal approval authority still need step7; the central buffer /
      backlog-limit policy remains step10.
    assertions: >-
      After re-verifying trust and authorization the host accepts new work;
      historical events are deduplicated on replay; duplicate commands and
      stale ownership do not repeat business actions, and state projection
      never overwrites local execution facts.
  - id: SC06
    title: 本地审计不可写、中心上传不可用
    run_mode: standalone
    status: planned
    tier: 1
    responsible_step: 6/7/10
    blocked_by: standalone-durable-actions
    implemented_slices: [local_evidence_gate_process]
    assertions: >-
      Local evidence-store failure stops new protected actions; central
      unavailability with valid local retention buffers uploads up to the
      declared limit with an explicit gap report; recovery retransmits
      evidence only, never business actions. Process-level local half
      delivered; note: the engine is fail-closed for ALL dispatches while
      the store is unwritable (readonly continuation is a registered gap);
      central-upload buffering remains planned (step10).
  - id: SC07
    title: 制品篡改、不兼容与回滚
    run_mode: standalone
    status: planned
    tier: 1
    responsible_step: 5（最小校验）、11/16（完整门禁）
    blocked_by: standalone-release-conformance
    assertions: >-
      Tampered or incompatible artifacts are refused activation and the last
      verified version stays active; rollback never restores revoked grants,
      consumed approvals, or executed actions.
  - id: SC08
    title: 默认遥测与外部模型数据流
    run_mode: standalone
    status: planned
    tier: 1
    responsible_step: 5/7/10、16
    blocked_by: runtime-standalone-distribution
    assertions: >-
      No business content is sent to any center without authorization; model
      and tool network targets and data categories match configuration;
      disabling telemetry is never conflated with forbidding external model
      calls.
  - id: SC09
    title: 完全隔离网络配置（条件性）
    run_mode: conditional
    status: planned
    tier: 1
    responsible_step: 11/16（启用时单独认证）
    blocked_by: standalone-release-conformance
    assertions: >-
      With external network blocked, the profile passes its scenarios only if
      local models, dependencies, artifacts, and valid trust material are all
      provisioned; any missing item leaves the profile explicitly unsupported.
  - id: SC10
    title: 独立升级 Runtime/宿主
    run_mode: standalone
    status: planned
    tier: 1
    responsible_step: 5/11/16
    blocked_by: standalone-release-conformance
    assertions: >-
      Runtime or host upgrades require no management platform and no
      synchronized upgrades of unchanged components; incompatible contract or
      state formats refuse activation or migrate first; active runs stay on
      their fixed versions.
