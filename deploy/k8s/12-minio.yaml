apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: hecate
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: hecate
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          ports: [{containerPort: 9000}]
          env:
            - {name: MINIO_ROOT_USER, value: minioadmin}
            - {name: MINIO_ROOT_PASSWORD, value: minioadmin}
          volumeMounts:
            - {name: minio-data, mountPath: /data}
      volumes:
        - name: minio-data
          persistentVolumeClaim: {claimName: minio-data}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: hecate
spec:
  selector: {app: minio}
  ports: [{port: 9000, targetPort: 9000}]
