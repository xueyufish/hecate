apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: hecate
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hecate
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: hecate}
            - {name: POSTGRES_USER, value: hecate}
            - {name: POSTGRES_PASSWORD, value: hecate}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U hecate"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim: {claimName: pgdata}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hecate
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
