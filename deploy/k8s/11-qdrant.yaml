apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: hecate
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: hecate
spec:
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - {containerPort: 6333}
            - {containerPort: 6334}
          volumeMounts:
            - {name: qdrant-data, mountPath: /qdrant/storage}
      volumes:
        - name: qdrant-data
          persistentVolumeClaim: {claimName: qdrant-data}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: hecate
spec:
  selector: {app: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: 6333}
    - {name: grpc, port: 6334, targetPort: 6334}
