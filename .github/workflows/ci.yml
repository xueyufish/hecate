name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # Docs-only changes (markdown, the inventory YAML, this workflow's own
  # docs) skip the four heavy jobs below. The detection job always runs;
  # on events where changed files cannot be determined (merge_group), it
  # fails safe to "code: true" so the merge queue keeps running everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'packages/**'
              - 'pilots/execution-backend-ts/**'
              - 'tests/**'
              - 'alembic/**'
              - 'docker/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install lint tools
        run: |
          python scripts/dev.py sync --profile lint
      - name: Lint
        run: python scripts/dev.py check lint
      - name: Format check
        run: python scripts/dev.py check format
      - name: Feature inventory admission (changed entries strict; historical debt reported)
        env:
          INVENTORY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$INVENTORY_BASE_SHA" ] || [ "$INVENTORY_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            uv run --no-sync python scripts/feature_inventory.py check --strict
          else
            uv run --no-sync python scripts/feature_inventory.py check --base-ref "$INVENTORY_BASE_SHA"
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: python scripts/dev.py sync
      - name: Type check
        run: python scripts/dev.py check types

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Parallel pytest via xdist inside this single job (supersedes the plain
    # sequential run that PRs #103–#107 passed with, ~16 min at the then-suite
    # size). The job name `test` is unchanged, so the branch-protection
    # required check keeps working — the PR #109 failure mode where
    # matrix.shard detached this job from branch protection does not apply.
    # cancel-in-progress remains deliberately absent (PR #109: it killed
    # in-flight runs on every follow-up push). `--dist loadfile` keeps each
    # test file on one worker so module-level test state stays intact.
    # timeout-minutes 60 stays as the backstop; tighten it once the parallel
    # wall time has settled across a few merge-queue runs.
    #
    # Docs-only gating (needs: changes + job-level if) is safe for the
    # required check: a job skipped via `if` reports Success and satisfies
    # branch protection (docs.github.com — "Using conditions to control job
    # execution"). Do NOT convert this to workflow-level `paths:` filtering —
    # a path-filtered workflow leaves the required check Pending and blocks
    # merging.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pilots/execution-backend-ts/package-lock.json
      - name: Install dependencies
        run: python scripts/dev.py sync
      - name: Run tests
        env:
          HECATE_REQUIRE_LIVE_PILOT: "1"
        run: |
          # npm ci stays here (not only in pilot-ts): the live_backend fixture
          # compiles the pilot with tsc for the B-side interop tests.
          npm ci --prefix pilots/execution-backend-ts
          python scripts/dev.py test tests/ -q --timeout=600 -n auto --dist loadfile -p no:cacheprovider
          python scripts/dev.py test packages/hecate-durable/tests/ -q --timeout=120 -p no:cacheprovider
          python scripts/dev.py test packages/hecate-runner/tests/ -q --timeout=120 -p no:cacheprovider

  # A-side of the execution-backend pilot spec (openspec/specs/execution-backend-pilot):
  # the self-contained vitest suite runs in parallel with the Python `test` job,
  # which covers the B-side via the live_backend fixture. Add `pilot-ts` to the
  # branch-protection required checks to keep the current gating strength.
  pilot-ts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pilots/execution-backend-ts/package-lock.json
      - name: Run TypeScript pilot suite
        run: |
          npm ci --prefix pilots/execution-backend-ts
          npm test --prefix pilots/execution-backend-ts

  migrations:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hecate
          POSTGRES_PASSWORD: hecate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hecate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: python scripts/dev.py sync --profile postgres
      - name: Durable-core fault suite against real PostgreSQL
        env:
          DURABLE_TEST_POSTGRES_URL: postgresql+psycopg://hecate:hecate@localhost:5432/postgres
        run: |
          python scripts/dev.py test packages/hecate-durable/tests/ -q --timeout=120 -p no:cacheprovider
      - name: Fresh-database migration drift gate
        env:
          DRIFT_ADMIN_URL: postgresql://hecate:hecate@localhost:5432/postgres
        run: python scripts/dev.py test tests/test_migrations/test_upgrade_drift.py -v

  # step6d continuation acceptance: run hang/resume and receipt-loss scenarios
  # on PostgreSQL as well, including its row-lock and transaction semantics.
  step6-continuation-pg:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hecate
          POSTGRES_PASSWORD: hecate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hecate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: python scripts/dev.py sync --profile postgres
      - name: Platform-native continuation acceptance against real PostgreSQL
        env:
          HECATE_STEP6_POSTGRES_URL: postgresql+psycopg://hecate:hecate@localhost:5432/postgres
          HECATE_REVIEW_POSTGRES_URL: postgresql+asyncpg://hecate:hecate@localhost:5432/postgres
        run: |
          python scripts/dev.py test tests/test_execution/test_builtin_continuation.py -q --timeout=120 --timeout-method=thread -p no:cacheprovider
          python scripts/dev.py test tests/test_execution/test_managed_lease_postgres_review.py -q --timeout=120 --timeout-method=thread -p no:cacheprovider
          python scripts/dev.py test tests/test_execution/test_entry_contract_pg_e2e.py -q --timeout=120 --timeout-method=thread -p no:cacheprovider
          python scripts/dev.py test tests/test_channel/test_g3_real_tcp_disconnect.py tests/test_mcp/test_agent_chat_entry_parity.py tests/test_execution/test_workflow_child_adapter.py -q --timeout=120 --timeout-method=thread -p no:cacheprovider
          # step5e: durable approval park/wake/resume — deterministic tier plus
          # the REAL worker-subprocess restart (process A killed mid-park,
          # process B resumes from PostgreSQL only).
          python scripts/dev.py test tests/test_execution/test_approval_wait_park.py -q --timeout=120 --timeout-method=thread -p no:cacheprovider
          python scripts/dev.py test tests/scenarios/test_durable_approval_restart.py -q --timeout=420 --timeout-method=thread -p no:cacheprovider
          # step5e continuation: workflow parent-child approval/restart combo.
          python scripts/dev.py test tests/test_execution/test_workflow_approval_combo.py -q --timeout=240 --timeout-method=thread -p no:cacheprovider
          python scripts/dev.py test tests/scenarios/test_workflow_approval_restart.py -q --timeout=600 --timeout-method=thread -p no:cacheprovider
          # Agent child calls: the shared scenarios on the PostgreSQL tier (the
          # independent-process helpers bind through the child environment),
          # then the cross-process concurrency/fault matrix — lease takeover,
          # quota race, slice CAS, death windows, held holds, callback races.
          python scripts/dev.py test tests/test_execution/test_agent_child_run.py -q --timeout=180 --timeout-method=thread -p no:cacheprovider
          python scripts/dev.py test tests/test_execution/test_agent_child_postgres_matrix.py -q --timeout=420 --timeout-method=thread -p no:cacheprovider
          # Workflow controller steps: the cross-process slice — worker death
          # between the step terminal and its verified callback, two
          # processes racing that callback behind a ready-file barrier, and
          # a cancel request recorded on a step another process is running.
          # (test_workflow_controller_steps.py is the SQLite contract tier.)
          python scripts/dev.py test tests/test_execution/test_workflow_controller_postgres.py -q --timeout=420 --timeout-method=thread -p no:cacheprovider
      - name: Verify live input restart recovery on PostgreSQL
        env:
          HECATE_STEP6_POSTGRES_URL: postgresql+psycopg://hecate:hecate@localhost:5432/postgres
          HECATE_LIVE_INPUT_EVIDENCE_DIR: ${{ runner.temp }}/live-input-restart-evidence
        run: |
          python scripts/dev.py test tests/test_execution/test_live_input_restart.py -q -rA --timeout=420 --timeout-method=thread -p no:cacheprovider
      - name: Preserve live input restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-input-restart-evidence
          path: ${{ runner.temp }}/live-input-restart-evidence/*.json
          if-no-files-found: error
      - name: Verify wait resource release and restart recovery on PostgreSQL
        env:
          HECATE_STEP6_POSTGRES_URL: postgresql+psycopg://hecate:hecate@localhost:5432/postgres
          HECATE_WAITRES_EVIDENCE_DIR: ${{ runner.temp }}/wait-resource-evidence
        run: |
          python scripts/dev.py test tests/test_execution/test_wait_resource_recovery.py -q -rA --timeout=420 --timeout-method=thread -p no:cacheprovider
      - name: Preserve wait resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-wait-resource-evidence
          path: ${{ runner.temp }}/wait-resource-evidence/*.json
          if-no-files-found: warn

  # step6f process matrix: HECATE_STEP6_POSTGRES_URL runs both [sqlite]
  # and [postgres] for managed lease, wake, reconnect and evidence-upload
  # scenarios, plus standalone SC06 local evidence failures.
  step6-pg-process-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hecate
          POSTGRES_PASSWORD: hecate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hecate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: python scripts/dev.py sync --profile postgres
      - name: Managed process matrix against real PostgreSQL
        env:
          HECATE_STEP6_POSTGRES_URL: postgresql+psycopg://hecate:hecate@localhost:5432/postgres
        run: |
          python scripts/dev.py test tests/scenarios/test_sc04_lease_renewal_policy.py tests/scenarios/test_sc05_managed_wake_chain.py tests/scenarios/test_sc05_managed_reconnect.py -q --timeout=420 -p no:cacheprovider
      - name: SC06 managed evidence upload faults and backfill
        env:
          HECATE_STEP6_POSTGRES_URL: postgresql+psycopg://hecate:hecate@localhost:5432/postgres
          HECATE_SC06_UPLOAD_EVIDENCE_DIR: ${{ runner.temp }}/sc06-managed-evidence-upload
        run: |
          python scripts/dev.py test tests/scenarios/test_sc06_managed_evidence_upload.py -q -rA --timeout=420 -p no:cacheprovider
      - name: Preserve SC06 managed evidence upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc06-managed-evidence-upload
          path: ${{ runner.temp }}/sc06-managed-evidence-upload/*.json
          if-no-files-found: error
      - name: SC06 local evidence failure windows on both Runner tiers
        env:
          HECATE_STEP6_POSTGRES_URL: postgresql+psycopg://hecate:hecate@localhost:5432/postgres
          HECATE_SC06_EVIDENCE_FAILURE_DIR: ${{ runner.temp }}/sc06-evidence-failure
        run: |
          python scripts/dev.py test tests/scenarios/test_sc06_evidence_failure.py -q -rA --timeout=420 -p no:cacheprovider
      - name: Preserve SC06 local evidence failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc06-evidence-failure
          path: ${{ runner.temp }}/sc06-evidence-failure/*.json
          if-no-files-found: error

  # 6.27 browser sandbox image — smoke test only; full HTTP driver flow
  # requires Docker-in-Docker and is covered by integration tests locally.
  runtime-wheel-clean-install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Check execution stack compatibility matrix
        run: python scripts/check_execution_stack_matrix.py
      - name: Prepare offline wheelhouse delivery
        run: python scripts/runner_env_prepare.py --target "$RUNNER_TEMP/offline_delivery"
      - name: Install the verified wheelhouse with networking disabled
        run: |
          digest=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_sha256"])' "$RUNNER_TEMP/offline_delivery/environment.json")
          sudo unshare --net -- runuser -u "$(id -un)" -- "$(command -v python)" -I scripts/runner_env_install.py \
            --delivery "$RUNNER_TEMP/offline_delivery" --expected-manifest-sha256 "$digest" --target "$RUNNER_TEMP/clean_venv"
      - name: Assert no full-hecate dependency leaked in
        working-directory: /tmp
        run: |
          "$RUNNER_TEMP/clean_venv/bin/python" -I - <<'PY'
          from importlib.metadata import distributions
          from importlib.util import find_spec
          assert all(dist.metadata["Name"].lower() != "hecate" for dist in distributions())
          assert find_spec("hecate") is None
          PY
      - name: Assert the durable core is importable standalone
        working-directory: /tmp
        run: |
          "$RUNNER_TEMP/clean_venv/bin/python" - <<'PY'
          from hecate_durable.storage import SqlDurableStore
          store = SqlDurableStore("sqlite://")
          store.create_schema()
          print("hecate-durable standalone OK")
          PY
      - name: Run kernel smoke (from outside the repo)
        working-directory: /tmp
        run: |
          "$RUNNER_TEMP/clean_venv/bin/python" "$GITHUB_WORKSPACE/packages/hecate-runtime/smoke/smoke_run.py"
      - name: Assert optional extras are declared unsupported, not crashing
        working-directory: /tmp
        run: |
          "$RUNNER_TEMP/clean_venv/bin/python" - <<'PY'
          from hecate_runtime.capabilities_status import capability_status
          caps = capability_status()
          for key in ("memory_consolidation", "sandbox_offload", "memory_provider", "a2a_handoff"):
              assert caps[key] == "unsupported", f"{key} should be unsupported without extras, got {caps[key]}"
          print("capability status:", caps)
          PY
      - name: Assert the runner CLI exists in the clean venv
        working-directory: /tmp
        run: |
          "$RUNNER_TEMP/clean_venv/bin/hecate-runner" --help > /dev/null
          echo "runner console script OK"
      - name: Install the test environment for the lifecycle drill
        run: python scripts/dev.py sync
      # step11/16 offline deployment acceptance: the full signed release
      # lifecycle (A cold start → switch to B → stale-composition refusal →
      # B cold start → rollback to A → historical terminal records, no
      # replayed business calls) inside a loopback-only network namespace.
      # The wheelhouse was prepared and downloaded on the host above; the
      # drill only installs from the locked delivery, so the isolated phase
      # resolves no dependencies. The namespace exposes exactly `lo` (brought
      # up as root before dropping privileges), and the drill asserts that
      # boundary and records it in its evidence JSON.
      - name: Run the release lifecycle drill in the loopback-only namespace
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            echo "== interfaces inside the drill namespace (must be lo only):"
            ip -o link show
            exec runuser -u "$1" -- env \
              HECATE_LIFECYCLE_ISOLATION=loopback-only \
              HECATE_LIFECYCLE_DELIVERY="$2/offline_delivery" \
              "$3/.venv/bin/python" -m pytest \
              "$3/tests/scenarios/test_runner_offline_lifecycle.py" \
              -q -rA --timeout=900 -p no:cacheprovider --basetemp="$2/runner-lifecycle"
          ' lifecycle-drill "$(id -un)" "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: Preserve the lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-offline-lifecycle-evidence
          path: ${{ runner.temp }}/runner-lifecycle/**/lifecycle-evidence.json
          if-no-files-found: warn

  docker-sandbox-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hecate-browser-sandbox image
        run: docker build -t hecate-browser-sandbox:ci docker/sandbox/
      - name: Verify image size under 700MB
        run: |
          size=$(docker image inspect hecate-browser-sandbox:ci --format '{{.Size}}')
          size_mb=$((size / 1024 / 1024))
          echo "Image size: ${size_mb}MB"
          if [ "$size_mb" -gt 700 ]; then
            echo "::error::Image size ${size_mb}MB exceeds 700MB budget"
            exit 1
          fi
      - name: Verify playwright imports
        run: |
          docker run --rm --entrypoint python hecate-browser-sandbox:ci -c "import playwright; print('playwright ok')"
      - name: Verify driver boots and healthz responds
        run: |
          cid=$(docker run -d --entrypoint sleep hecate-browser-sandbox:ci infinity)
          docker exec -d "$cid" python /opt/sandbox/entrypoint.py --port 8080
          sleep 3
          docker exec "$cid" curl -sf http://127.0.0.1:8080/healthz
          docker rm -f "$cid"
