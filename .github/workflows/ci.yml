name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # Docs-only changes (markdown, the inventory YAML, this workflow's own
  # docs) skip the four heavy jobs below. The detection job always runs;
  # on events where changed files cannot be determined (merge_group), it
  # fails safe to "code: true" so the merge queue keeps running everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'packages/**'
              - 'pilots/execution-backend-ts/**'
              - 'tests/**'
              - 'alembic/**'
              - 'docker/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff pyyaml
      - name: Lint
        run: ruff check src/hecate/ packages/ tests/ scripts/feature_inventory.py
      - name: Format check
        run: ruff format --check src/hecate/ packages/ tests/ scripts/feature_inventory.py
      - name: Feature inventory admission (changed entries strict; historical debt reported)
        env:
          INVENTORY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$INVENTORY_BASE_SHA" ] || [ "$INVENTORY_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            python scripts/feature_inventory.py check --strict
          else
            python scripts/feature_inventory.py check --base-ref "$INVENTORY_BASE_SHA"
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --package hecate --package hecate-enterprise --package hecate-memory --package hecate-ops --package hecate-llm --package hecate-sandbox --package hecate-channel-slack --package hecate-channel-feishu --extra dev
      - name: Type check
        run: uv run mypy src/ packages/

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Deliberately the plain sequential run that PRs #103–#107 passed with
    # (~16 min wall). Do NOT add pytest-xdist (-n auto), matrix sharding, or
    # a concurrency/cancel-in-progress block here without a separate infra PR:
    # each of those was tried on PR #109 and caused cascading failures —
    # cancel-in-progress killed in-flight runs on every follow-up push, and
    # matrix.shard detached this job from the branch-protection `test`
    # required check. timeout-minutes 60 = ~4x historical wall time; a single
    # hanging test surfaces as a clear FAIL via pytest-timeout instead of a
    # silent job cancellation.
    #
    # Docs-only gating (needs: changes + job-level if) is safe for the
    # required check: a job skipped via `if` reports Success and satisfies
    # branch protection (docs.github.com — "Using conditions to control job
    # execution"). Do NOT convert this to workflow-level `paths:` filtering —
    # a path-filtered workflow leaves the required check Pending and blocks
    # merging.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pilots/execution-backend-ts/package-lock.json
      - name: Install dependencies
        run: uv sync --package hecate --package hecate-enterprise --package hecate-memory --package hecate-ops --package hecate-llm --package hecate-sandbox --package hecate-channel-slack --package hecate-channel-feishu --extra dev
      - name: Install hecate-runner into the dev environment (package tests)
        run: uv pip install --no-deps -e packages/hecate-runner
      - name: Run tests
        env:
          HECATE_REQUIRE_LIVE_PILOT: "1"
        run: |
          npm ci --prefix pilots/execution-backend-ts
          npm test --prefix pilots/execution-backend-ts
          uv pip install pytest-timeout
          uv run pytest tests/ -q --timeout=600 -p no:cacheprovider

  migrations:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hecate
          POSTGRES_PASSWORD: hecate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hecate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --package hecate --package hecate-enterprise --package hecate-memory --package hecate-ops --package hecate-llm --package hecate-sandbox --package hecate-channel-slack --package hecate-channel-feishu --extra dev
      - name: Fresh-database migration drift gate
        env:
          DRIFT_ADMIN_URL: postgresql://hecate:hecate@localhost:5432/postgres
        run: uv run pytest tests/test_migrations/test_upgrade_drift.py -v

  # 6.27 browser sandbox image — smoke test only; full HTTP driver flow
  # requires Docker-in-Docker and is covered by integration tests locally.
  runtime-wheel-clean-install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Build hecate-runtime wheel (non-editable artifact)
        run: uv build --package hecate-runtime
      - name: Build hecate-runner wheel (non-editable artifact)
        run: uv build --package hecate-runner
      - name: Install wheels into a clean venv (no repo source path)
        run: |
          python -m venv "$RUNNER_TEMP/clean_venv"
          "$RUNNER_TEMP/clean_venv/bin/python" -m pip install dist/hecate_runtime-*.whl dist/hecate_runner-*.whl
      - name: Assert no full-hecate dependency leaked in
        run: |
          installed=$("$RUNNER_TEMP/clean_venv/bin/python" -m pip list --format freeze | grep -ixE 'hecate==.*' || true)
          if [ -n "$installed" ]; then
            echo "::error::clean venv contains the full hecate application: $installed"
            exit 1
          fi
      - name: Run kernel smoke (from outside the repo)
        working-directory: /tmp
        run: |
          "$RUNNER_TEMP/clean_venv/bin/python" "$GITHUB_WORKSPACE/packages/hecate-runtime/smoke/smoke_run.py"
      - name: Assert optional extras are declared unsupported, not crashing
        working-directory: /tmp
        run: |
          "$RUNNER_TEMP/clean_venv/bin/python" - <<'PY'
          from hecate_runtime.capabilities_status import capability_status
          caps = capability_status()
          for key in ("memory_consolidation", "sandbox_offload", "memory_provider", "a2a_handoff"):
              assert caps[key] == "unsupported", f"{key} should be unsupported without extras, got {caps[key]}"
          print("capability status:", caps)
          PY
      - name: Assert the runner CLI exists in the clean venv
        working-directory: /tmp
        run: |
          "$RUNNER_TEMP/clean_venv/bin/hecate-runner" --help > /dev/null
          echo "runner console script OK"

  docker-sandbox-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hecate-browser-sandbox image
        run: docker build -t hecate-browser-sandbox:ci docker/sandbox/
      - name: Verify image size under 700MB
        run: |
          size=$(docker image inspect hecate-browser-sandbox:ci --format '{{.Size}}')
          size_mb=$((size / 1024 / 1024))
          echo "Image size: ${size_mb}MB"
          if [ "$size_mb" -gt 700 ]; then
            echo "::error::Image size ${size_mb}MB exceeds 700MB budget"
            exit 1
          fi
      - name: Verify playwright imports
        run: |
          docker run --rm --entrypoint python hecate-browser-sandbox:ci -c "import playwright; print('playwright ok')"
      - name: Verify driver boots and healthz responds
        run: |
          cid=$(docker run -d --entrypoint sleep hecate-browser-sandbox:ci infinity)
          docker exec -d "$cid" python /opt/sandbox/entrypoint.py --port 8080
          sleep 3
          docker exec "$cid" curl -sf http://127.0.0.1:8080/healthz
          docker rm -f "$cid"
