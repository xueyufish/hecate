name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Lint
        run: ruff check src/hecate/ packages/ tests/
      - name: Format check
        run: ruff format --check src/hecate/ packages/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --package hecate --package hecate-enterprise --package hecate-memory --extra dev --prerelease=allow
      - name: Type check
        run: uv run mypy src/ packages/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shard the test suite to dodge pytest-xdist 3.8.0's flaky
    # end-of-run controller deadlock (issue pytest-dev/pytest-xdist#1313):
    # each shard runs with only 2 workers, which sharply lowers the
    # execnet-pipe race probability. fail-fast:false keeps both shards'
    # independent results visible if one stalls.
    strategy:
      fail-fast: false
      matrix:
        shard:
            # Shard A: CPU/pure-Python heavy (engine + models + api).
          - id: a
            paths: tests/test_engine tests/test_api tests/test_memory tests/test_enterprise tests/test_a2a tests/test_plugin tests/test_model_hub tests/test_models tests/test_integration tests/test_install.py
            # Shard B: IO/integration heavy (services + small dirs).
          - id: b
            paths: tests/test_services tests/test_e2e tests/test_mcp tests/test_ops_center tests/test_skill_registry tests/test_core tests/test_observability tests/test_i18n tests/test_cli tests/test_channel tests/test_migrations tests/test_build tests/test_vault tests/test_auth tests/test_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --package hecate --package hecate-enterprise --package hecate-memory --extra dev --prerelease=allow
      - name: Run tests (shard ${{ matrix.shard.id }})
        run: |
          uv pip install pytest-timeout
          uv run pytest ${{ matrix.shard.paths }} -q -n 2 --timeout=300 -p no:cacheprovider

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hecate
          POSTGRES_PASSWORD: hecate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hecate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --package hecate --package hecate-enterprise --package hecate-memory --extra dev --prerelease=allow
      - name: Fresh-database migration drift gate
        env:
          DRIFT_ADMIN_URL: postgresql://hecate:hecate@localhost:5432/postgres
        run: uv run pytest tests/test_migrations/test_upgrade_drift.py -v

  # 6.27 browser sandbox image — smoke test only; full HTTP driver flow
  # requires Docker-in-Docker and is covered by integration tests locally.
  docker-sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hecate-browser-sandbox image
        run: docker build -t hecate-browser-sandbox:ci docker/sandbox/
      - name: Verify image size under 700MB
        run: |
          size=$(docker image inspect hecate-browser-sandbox:ci --format '{{.Size}}')
          size_mb=$((size / 1024 / 1024))
          echo "Image size: ${size_mb}MB"
          if [ "$size_mb" -gt 700 ]; then
            echo "::error::Image size ${size_mb}MB exceeds 700MB budget"
            exit 1
          fi
      - name: Verify playwright imports
        run: |
          docker run --rm --entrypoint python hecate-browser-sandbox:ci -c "import playwright; print('playwright ok')"
      - name: Verify driver boots and healthz responds
        run: |
          cid=$(docker run -d --entrypoint sleep hecate-browser-sandbox:ci infinity)
          docker exec -d "$cid" python /opt/sandbox/entrypoint.py --port 8080
          sleep 3
          docker exec "$cid" curl -sf http://127.0.0.1:8080/healthz
          docker rm -f "$cid"
