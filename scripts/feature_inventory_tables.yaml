# Governed registration tables for feature_inventory.py managed regions.
#
# These are per-capability / per-process registries (not per-feature data),
# so they live here rather than in the feature inventory. Content mirrors the
# evolution plan §一/§三/§七 tables; edit here and re-run
# `python scripts/feature_inventory.py sync`.
contract_registry:
  - - "Runtime (execution backend)"
    - "Platform→Runtime direction: `AgentExecutionBackend` (step3 draft, frozen at step8)"
    - "execution/"
    - "control plane owns platform records; backend owns run facts"
    - "draft; support window defined at freeze"
  - - "Memory / Knowledge"
    - "ProviderBinding + capability declaration (step9a); Knowledge service vs componentized retrieval certified separately"
    - "knowledge/memory providers"
    - "provider owns data/indexes; platform keeps references+evidence"
    - "existing specs; v2 fields land with step9"
  - - "Evaluation"
    - "`EvaluationBackend` submit/query/cancel/result envelope (step10)"
    - "ops/evaluation"
    - "evaluation backend owns results; governance consumes evidence"
    - "existing evaluation specs; backend seam lands at step10"
  - - "Observability"
    - "OTLP export + trace-association fields (step10); evidence store stays independent"
    - "ops (hecate-ops)"
    - "trace backend owns diagnostics; platform owns governance evidence"
    - "existing monitoring specs; exporter seam at step10"
  - - "Gateway (tool/action)"
    - "Policy decision + execution receipt contract (step7)"
    - "tools/gateway + tools/policy"
    - "gateway owns action receipts"
    - "action-authorization spec; cross-backend version at step7"

capability_domains:
  - - "Agent Engineering"
    - "`studio/` (agents, workflows, templates, prompts)"
    - "`studio/engineering/`"
    - "drafts, build records; release via manifest"
    - "engineering↔release seam not separated"
  - - "AgentOps"
    - "`ops/` (health, costs, traces, alerts, quotas)"
    - "`ops/agentops/`"
    - "alerting, disposition records"
    - "no authoritative Task/Run query source yet"
  - - "Agent Control Plane"
    - "scattered (`studio/`, `channel/`)"
    - "`execution/` + `collaboration/`"
    - "deployment desired config, platform task records, run projections, control requests; teams/delegation"
    - "Deployment/Task/Run model lands at step4"
  - - "Agent Governance"
    - "`enterprise/`, `ops/api/audit.py`, `tools/policy/`"
    - "`enterprise/governance/` (+`ops/evidence/`)"
    - "policy/approval/release decisions; evidence write+query"
    - "approval records vs runtime pause not separated"
  - - "Security"
    - "`enterprise/auth/`, `enterprise/vault/`, `tools/gateway/`, `tools/policy/`"
    - "existing packages stay separate"
    - "identity resolution, credentials, action enforcement"
    - "enforcement not yet covering all entries (B1—B3 follow-ups)"
  - - "Evaluation"
    - "`ops/evaluation/`"
    - "existing package (+adapter sub-package)"
    - "evaluation tasks and results"
    - "`EvaluationBackend` seam lands at step10"
  - - "MCP/A2A access"
    - "`tools/mcp/`, `channel/a2a/`"
    - "existing packages + gateway adapters"
    - "protocol sessions/mappings"
    - "protocol identity→platform authorization incomplete"

iterations:
  - - "I-A"
    - "Baseline increments & boundary close-out"
    - "step1 + step2 (this change); G1/G2 fixes merged"
    - "Dependency closure, deployment topologies, SC specs, governed catalogue"
    - "No new runtime, no wholesale directory moves"
  - - "I-B"
    - "Contracts & shared assembly"
    - "step3 draft + real non-Python no-side-effect probe; step5a shared assembly; step4 tables"
    - "Public contract free of Pregel/platform ORM; old service runs shared assembly"
    - "No production writes, no advanced capability freeze"
  - - "I-Ba"
    - "Standalone execution technical preview"
    - "step5b/5c wheel + host; step5d one entry in parallel"
    - "Clean-install cold start; read-only SC01/SC02 with local evidence"
    - "No production writes, durable recovery, or managed lease"
  - - "I-Ca"
    - "Standalone product reliability loop"
    - "step6 local persistence; step7 local actions/approval; minimal step10/11; step16 SC faults"
    - "No-control-plane tasks with local approval, restart recovery, artifact update/rollback"
    - "No platform tables, management UI, teams, or full Knowledge"
  - - "I-Cb"
    - "Managed task loop"
    - "step4/5d platform hookup; step6 projection/commands; step7 leases; step11 central release; step14 minimal UI; step16 disconnect set"
    - "Same host enrolled; lease-bounded disconnect; truthful human view"
    - "Standalone mode is not the disconnect fallback"
  - - "I-D"
    - "Real external execution certification"
    - "step8 split: self-hosted heterogeneous / hosted harness / remote sandbox"
    - "Per-combination data-flow, identity, enforcement, cancellation, reconciliation reports"
    - "No fabricated cancellation or hosted-internal control"
  - - "I-E"
    - "Independent capability replacement"
    - "step9a/9b then 9c/9d; step10 parallel; step11 combo releases; step16 single-capability upgrades"
    - "Memory and Knowledge replaceable; per-sample/stage evaluation passes"
    - "No generic online dual-write or self-built graph product"
  - - "I-F"
    - "Enterprise teams & human supervision"
    - "step12 fixed teams; step13 durable delegation; step14 full workbench"
    - "Cross-runtime handoffs; member changes never broaden access; real intervention receipts"
    - "No unbounded dynamic team formation"
  - - "I-G"
    - "Operations & bounded autonomy"
    - "step16 close-out per profile; step15 only after reliable dispositions"
    - "Recovery/load/isolation support matrix; bounded auto-disposition"
    - "No untested SLA promises"
  - - "I-H"
    - "Ecosystem on demand"
    - "step17/18 when conditions hold; step19 continuously from I-B"
    - "External org/developer onboarding; legacy paths retired with data-exit records"
    - "No public marketplace by default"

milestones:
  - - "M-S"
    - "Standalone execution delivery"
    - "step1 increments; step2/3; step5a—5c; production needs step6/7 local slices + minimal step10/11 + step16"
    - "I-Ba clean install + read-only run; I-Ca local identity/approval, recovery, artifact gates"
    - "Full management-plane features; un-certified air-gapped/Python-embedding modes; RAG/vector stores are not prerequisites"
  - - "M-A"
    - "Cross-backend governance loop"
    - "step1—8 with minimal step10/11/14 and staged step16"
    - >-
      Built-in managed loop first (I-Cb), then self-hosted heterogeneous and hosted harness pass the same
      task/policy/approval/release/event contracts; per-combination data-flow + session reconciliation
    - "Lossless state migration; enforced control over cross-enterprise or vendor-internal actions — hosted verification is part of this milestone, not vendor-specific"
  - - "M-B"
    - "Replaceable enterprise capabilities & release"
    - "step9—11, step16 per scope"
    - "Memory/full-Knowledge/componentized retrieval replaceable; per-sample grouped comparison; at least one Memory and one Knowledge component independently upgradable"
    - "Identical advanced capabilities on all backends; reconstructing vendor-internal state; stage traces from every external RAG"
  - - "M-C"
    - "Enterprise team collaboration"
    - "step12—14"
    - "Cross-runtime team tasks; reliable human observation/intervention; member changes never inherit private connectors"
    - "Unbounded agent societies"
  - - "M-D"
    - "Operable, recoverable platform"
    - "step16 throughout; step15 separately admitted"
    - "Fault/recovery/load/isolation matrix for delivered scope; bounded autonomy only with proven dispositions"
    - "Unverified deployment combinations; blanket compliance claims"
  - - "M-E"
    - "Federation & ecosystem"
    - "conditional step17—18"
    - "Cross-org collaboration per contract; external adapter contribution"
    - "Public marketplace success assumptions"
  - - "M-R"
    - "Continuous consolidation"
    - "step19 in batches"
    - "Retirement evidence; dependency and documentation consistency"
    - "Package count for its own sake"
