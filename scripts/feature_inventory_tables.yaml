iterations:
- - I-A
  - Baseline increments & boundary close-out
  - step1 + step2; G1/G2 fixes merged
  - Dependency closure, deployment topologies, SC specs, governed catalogue
  - No new runtime, no wholesale directory moves
- - I-B
  - Contracts & shared assembly
  - step3 draft + real non-Python no-side-effect probe; step5a shared assembly; step4 tables
  - Public contract free of Pregel/platform ORM; old service runs shared assembly
  - No production writes, no advanced capability freeze
- - I-Ba
  - Standalone execution technical preview
  - step5b/5c wheel + host; step5d one entry in parallel
  - Clean-install cold start; read-only SC01/SC02 with local evidence
  - No production writes, durable recovery, or managed lease
- - I-Ca
  - Standalone product reliability loop
  - step6 local persistence; step7 local actions/approval; minimal step10/11; step16 SC faults
  - No-control-plane tasks with local approval, restart recovery, artifact update/rollback
  - No platform tables, management UI, teams, or full Knowledge
- - I-Cb
  - Managed task loop
  - step4/5d platform hookup; step6 projection/commands; step7 leases; step11 central release; step14 minimal UI; step16 disconnect
    set
  - Same host enrolled; lease-bounded disconnect; truthful human view
  - Standalone mode is not the disconnect fallback
- - I-D
  - Real external execution certification
  - 'step8 split: self-hosted heterogeneous / hosted harness / remote sandbox'
  - Per-combination data-flow, identity, enforcement, cancellation, reconciliation reports
  - No fabricated cancellation or hosted-internal control
- - I-E
  - Independent capability replacement
  - step9a/9b then 9c/9d; step10 parallel; step11 combo releases; step16 single-capability upgrades
  - Memory and Knowledge replaceable; per-sample/stage evaluation passes
  - No generic online dual-write or self-built graph product
- - I-F
  - Enterprise teams & human supervision
  - step12 fixed teams; step13 durable delegation; step14 full workbench
  - Cross-runtime handoffs; member changes never broaden access; real intervention receipts
  - No unbounded dynamic team formation
- - I-G
  - Operations & bounded autonomy
  - step16 close-out per profile; step15 only after reliable dispositions
  - Recovery/load/isolation support matrix; bounded auto-disposition
  - No untested SLA promises
- - I-H
  - Ecosystem on demand
  - step17/18 when conditions hold; step19 continuously from I-B
  - External org/developer onboarding; legacy paths retired with data-exit records
  - No public marketplace by default
