iterations:
- - I-A
  - Baseline increments & boundary close-out
  - step1 + step2; G1/G2 fixes merged
  - Dependency closure, deployment topologies, SC specs, governed catalogue
  - No new runtime, no wholesale directory moves
- - I-B
  - Contracts & shared assembly
  - step3 draft + real non-Python no-side-effect probe; step5a shared assembly; step4 tables
  - Public contract free of Pregel/platform ORM; old service runs shared assembly
  - No production writes, no advanced capability freeze
- - I-Ba
  - Standalone execution technical preview
  - step5b/5c wheel + host; step5d one entry in parallel
  - Clean-install cold start; read-only SC01/SC02 with local evidence
  - No production writes, durable recovery, or managed lease
- - I-Ca
  - Standalone product reliability loop
  - step5e/6/7 local Controller, shared recovery/actions/approval and graph composition;
    minimal step10/11 and step16; existing technical slices retained as scoped evidence,
    Controller and full acceptance pending
  - Without the control plane, real-model autonomous tool selection, local Plan, delivery/evidence
    and versioned acceptance; Agent/Workflow composition; decisions/actions/Child Runs and
    waits recover or reconcile; continuation preserves budget/deadline; file profiles
    verify workspace/artifact recovery; artifact updates and rollback are verified
  - No platform tables, management UI, enterprise teams, program execution or full Knowledge
- - I-Cb
  - Managed task loop
  - step5e/6/7 shared execution slices; step4/5d platform hookup; minimal central
    release and intervention at step11/14; step16 faults; routing changes follow certification
  - Platform and Runner consume the same Controller/Workflow capability with fixed identity/version;
    delivery, evidence, versioned acceptance and stoppable continuation pass; budgets
    accumulate, disconnect is lease-bounded and reconnect writes no duplicates; file
    profiles verify recovery and active legacy Runs retain their bindings
  - I-Ca production certification is not a prerequisite; standalone authorization is
    never the disconnect fallback; no assumed enforced cancellation of every action
- - I-D
  - Revoked — external execution certification
  - 'revoked: external runtime integration removed from the evolution plan (ADR-037); no
    deliverables; historical contracts, pilot and evidence retained; revival requires a
    new proposal'
  - None (numbering retained for history)
  - No current implementation or certification commitment
- - I-E
  - Independent capability replacement
  - step9a/9b then 9c/9d; step10 parallel; step11 combo releases; step16 single-capability upgrades
  - Memory and Knowledge replaceable; per-sample/stage evaluation passes
  - No generic online dual-write or self-built graph product
- - I-F
  - Enterprise teams & human supervision
  - step12 fixed teams; step13 durable delegation; step14 full workbench
  - Built-in Agent handoffs with task/artifact acceptance; member changes never
    broaden access; real intervention receipts; reuse step5e/6 child execution
  - No unbounded dynamic team formation
- - I-G
  - Operations & bounded autonomy
  - step16 close-out per profile; step15 only after reliable dispositions
  - Recovery/load/isolation support matrix; bounded auto-disposition
  - No untested SLA promises
- - I-H
  - Ecosystem on demand
  - step17/18 when conditions hold; step19 continuously from I-B
  - External org/developer onboarding; legacy paths retired with data-exit records
  - No public marketplace by default
